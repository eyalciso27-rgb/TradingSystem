# Prometheus configuration (IMP-0402). Metrics only — operational logs go
# to Loki via Alloy; the tamper-evident audit trail stays in PostgreSQL.
# High-cardinality identifiers (order ids, symbols) are never labels here.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # Health monitoring for existing services (PostgreSQL, NATS JetStream).
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]
