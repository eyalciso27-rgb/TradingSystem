# PAPER environment override (IMP-0401, Security spec section 6).
#
# Paper is fully isolated from dev/test and from any future Live stack:
# its own network, its own volumes, its own credentials (PAPER_* variables,
# provided at deploy time from the PAPER secret store per IMP-0302 — never
# shared with any other environment and never written into this file).
# No ports are published: services are reachable only on the internal
# trading-paper network. LIVE remains disabled — no live stack exists.
#
# Usage:
#   docker compose -f deploy/compose.yaml -f deploy/compose.paper.yaml up -d

services:
  postgres:
    environment:
      POSTGRES_USER: ${PAPER_POSTGRES_USER:?PAPER credentials come from the PAPER secret store}
      POSTGRES_PASSWORD: ${PAPER_POSTGRES_PASSWORD:?PAPER credentials come from the PAPER secret store}
      POSTGRES_DB: ${PAPER_POSTGRES_DB:-trading_paper}
    volumes:
      # postgres:18 image layout: single mount at /var/lib/postgresql (data
      # lives in a versioned subdirectory, enabling pg_upgrade --link).
      - pg-data-paper:/var/lib/postgresql

  # The scheduler process (apps/scheduler): startup maintenance, then a tick
  # every TRADING_SCHEDULER_TICK_HOURS for the life of the container. THIS is
  # what makes the monthly S&P 500 universe refresh automatic.
  #
  # It is an ordinary service of the PAPER stack, with no profile and no extra
  # flag, because the whole point is that the owner never has to remember it.
  # Normal paper startup starts it.
  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.scheduler
    environment:
      TRADING_MODE: PAPER
      TRADING_UNIVERSE_ROOT: /data/sp500-current
      TRADING_SCHEDULER_TICK_HOURS: ${TRADING_SCHEDULER_TICK_HOURS:-6}
      TRADING_LOG_LEVEL: ${TRADING_LOG_LEVEL:-INFO}
    # Its own volume: the snapshot history survives host and container restarts
    # and is never shared with dev/test.
    volumes:
      - universe-data-paper:/data/sp500-current
    # Comes back after a crash, a daemon restart or a host reboot -- an
    # automatic refresh that stops at the first reboot is not automatic.
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - trading

  nats:
    volumes:
      - nats-data-paper:/data

networks:
  trading:
    name: trading-paper

volumes:
  pg-data-paper:
  nats-data-paper:
  universe-data-paper:
