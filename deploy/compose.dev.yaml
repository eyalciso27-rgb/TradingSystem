# Development override (IMP-0401): persistent local volumes and loopback-only
# port bindings. Only approved endpoints are exposed, and only on 127.0.0.1 —
# PostgreSQL and NATS are never reachable from outside the developer machine.
#
# Usage:
#   docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml up -d

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 image layout: single mount at /var/lib/postgresql (data
      # lives in a versioned subdirectory, enabling pg_upgrade --link).
      - pg-data-dev:/var/lib/postgresql

  # Same service, same automatic behaviour, its own volume. Defined here rather
  # than in the base stack so an ephemeral test/CI `up` stays infrastructure-only.
  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.scheduler
    environment:
      TRADING_MODE: PAPER
      TRADING_UNIVERSE_ROOT: /data/sp500-current
      TRADING_SCHEDULER_TICK_HOURS: ${TRADING_SCHEDULER_TICK_HOURS:-6}
      TRADING_LOG_LEVEL: ${TRADING_LOG_LEVEL:-INFO}
    volumes:
      - universe-data-dev:/data/sp500-current
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - trading

  nats:
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data-dev:/data

networks:
  trading:
    name: trading-dev

volumes:
  pg-data-dev:
  nats-data-dev:
  universe-data-dev:
