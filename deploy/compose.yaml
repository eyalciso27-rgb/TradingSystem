# Base / test-CI stack (IMP-0401, ADR-009: Docker Compose on Oracle ARM64).
#
# Infrastructure services only (PostgreSQL 18 per ADR-006, NATS JetStream per
# ADR-007); application services join once their canonical Dockerfiles exist.
# Used directly for ephemeral test/CI runs (no published ports, no volumes);
# development and paper are overrides (compose.dev.yaml / compose.paper.yaml).
#
# No credentials live in this file: every secret value comes from the
# environment at run time (`:?` fails closed when unset — no defaults). Both
# images are official multi-arch (amd64 + arm64) and are never tagged latest.

name: trading-system

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be provided; no default credentials}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided; no default credentials}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trading

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trading

  # The scheduler process (apps/scheduler). This is what makes the monthly
  # S&P 500 universe refresh automatic; it is not a cron job and not a CLI the
  # owner has to remember. Behind the "apps" profile so an ephemeral test/CI
  # `up` still starts infrastructure only.
  scheduler:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.scheduler
    environment:
      # PAPER unless LIVE is named explicitly; an unknown value fails closed.
      TRADING_MODE: ${TRADING_MODE:-PAPER}
      # Where accepted monthly snapshots are kept permanently.
      TRADING_UNIVERSE_ROOT: /data/sp500-current
      TRADING_SCHEDULER_TICK_HOURS: ${TRADING_SCHEDULER_TICK_HOURS:-6}
      TRADING_LOG_LEVEL: ${TRADING_LOG_LEVEL:-INFO}
    # The refresh must survive a restart, so the snapshot history is a volume
    # rather than container-local state.
    volumes:
      - universe-data:/data/sp500-current
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - trading

networks:
  trading:
    name: trading-test

volumes:
  # Ephemeral test/CI: the scheduler profile is off by default, and this volume
  # exists only so the service definition is complete. Dev and paper override it.
  universe-data:
