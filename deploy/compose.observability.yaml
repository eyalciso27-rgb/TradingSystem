# Observability stack (IMP-0402, ADR-010: Prometheus + Grafana + Loki +
# Alloy + Alertmanager; exporters for PostgreSQL and NATS health monitoring).
#
# Combined with the base stack and one environment override, e.g.:
#   docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml \
#                  -f deploy/compose.observability.yaml up -d
#
# Nothing here is exposed to the internet. The only published endpoint is
# Grafana on 127.0.0.1:3000 (local browser search/filter/explore); every
# other service is reachable solely on the internal observability network.
# Grafana admin credentials are required at runtime (:? fails closed — no
# default credentials). All images are official multi-arch (amd64 + arm64).

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - observability

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - observability

  loki:
    image: grafana/loki:3.4.3
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - observability

  alloy:
    image: grafana/alloy:v1.9.2
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.6.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be provided; no default credentials}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be provided; no default credentials}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - observability

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-trading}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:?POSTGRES_USER must be provided; no default credentials}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided; no default credentials}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9187/metrics"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - observability
      - trading

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.17.3
    command:
      ["-varz", "-connz", "-subz", "-jsz", "all", "http://nats:8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7777/metrics"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - observability
      - trading

networks:
  observability:
    name: trading-observability

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
