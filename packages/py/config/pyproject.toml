[project]
name = "trading-config"
version = "0.1.0"
description = "Versioned configuration loading and validation"
requires-python = ">=3.13,<3.14"
dependencies = ["trading-contracts", "pydantic>=2.9,<3", "cryptography>=43,<47"]

[tool.uv.sources]
trading-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
