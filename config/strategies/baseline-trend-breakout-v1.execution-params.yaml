# Execution parameters for the MVP strategy baseline-trend-breakout-v1.
#
# These are NOT new parameters. Each number is the machine-usable form of a
# value the owner already froze in prose in
#   docs/strategies/baseline-trend-breakout-v1.yaml
# (FROZEN 2026-08-13, fingerprint sha256:75f299b8...e84dfed0). This file exists
# so the numeric extraction is auditable in one place; the deterministic
# evaluator loads the same values via
#   trading_application.baseline_strategy_config.baseline_trend_breakout_v1_policy()
# and tests/strategy/test_baseline_strategy_config.py binds both to the frozen
# record. A material change requires a NEW frozen version_id (supersede) — never
# an edit here.
strategy_id: baseline-trend-breakout-v1
version_id: v1
frozen_fingerprint: "sha256:75f299b89e408ef332cd39a46f92d417ef637b3c5a5c1712801774c9e84dfed0"

parameters:
  sma_trend_period:
    value: 150
    source_key: setup.definition
    owner_text: "Trend: Close > SMA150 AND SMA150(today) > SMA150(20 trading days ago)."
  sma_trend_rising_lookback:
    value: 20
    source_key: setup.definition
    owner_text: "SMA150(today) > SMA150(20 trading days ago)."
  base_min_bars:
    value: 10
    source_key: setup.definition
    owner_text: "Contracting Base: base duration 10-20 trading days."
  base_max_bars:
    value: 20
    source_key: setup.definition
    owner_text: "Contracting Base: base duration 10-20 trading days."
  range_window:
    value: 5
    source_key: setup.definition
    owner_text: "Range(last 5 days) < Range(previous 5 days)."
  atr_short_period:
    value: 10
    source_key: setup.definition
    owner_text: "ATR10 < ATR20."
  atr_long_period:
    value: 20
    source_key: setup.definition
    owner_text: "ATR10 < ATR20; ATR20 drives entry cap and structural stop."
  entry_atr_multiple:
    value: "0.25"
    source_key: entry.rule
    owner_text: "MaximumEntryPrice = BreakoutClose + 0.25 * ATR20."
  stop_atr_multiple:
    value: "0.25"
    source_key: exit.stop_rule
    owner_text: "StructuralStop = BaseLow - 0.25 * ATR20."
  max_risk_atr_multiple:
    value: "2.5"
    source_key: exit.stop_rule
    owner_text: "If EntryPrice - StructuralStop > 2.5 * ATR20 then SKIP TRADE."

# The fusion manifest is the owner-approved structural representation of the
# breakout trigger: a single REQUIRED technical.breakout that must be TRIGGERED.
fusion_manifest:
  version: v1
  entries:
    - assessment_key: technical.breakout
      role: REQUIRED
      required_status: TRIGGERED
