# logrotate configuration for IBC / IB Gateway logs.
#
# Install as /etc/logrotate.d/ibgateway.
#
# The IBC log is the watchdog's login-marker source and grows continuously.
# Unrotated it eventually fills the volume, which takes the Gateway down —
# an availability failure created by logging, not by trading.
#
# `copytruncate` is deliberate: IBC holds the file open and is not signalled to
# reopen, so renaming the inode would leave it writing to a deleted file. The
# watchdog only ever reads the TAIL, so a truncate boundary cannot corrupt its
# classification (a missed marker degrades to LOGIN_REQUIRED/UNKNOWN, which is
# fail-closed).
#
# Logs may contain operational text but never credentials — IBC is configured
# not to echo them, and the watchdog never writes them anywhere.

/home/opc/ibc/logs/*.log {
    daily
    rotate 14
    maxsize 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    # Restrictive: the log is readable only by the service user.
    create 0600 opc opc
    su opc opc
}
