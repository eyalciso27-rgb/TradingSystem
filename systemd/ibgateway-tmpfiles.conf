# systemd-tmpfiles configuration for the IB Gateway runtime directory.
#
# Install as /etc/tmpfiles.d/ibgateway.conf, then:
#     systemd-tmpfiles --create /etc/tmpfiles.d/ibgateway.conf
#
# THIS FILE IS THE SINGLE CANONICAL OWNER OF /run/ibgateway
# ---------------------------------------------------------
# Neither ibgateway-ibc.service nor ibgateway-watchdog.service declares
# RuntimeDirectory=ibgateway, and neither may. Both consume this directory;
# only tmpfiles.d creates it. One creator, one lifetime, one declared mode.
#
# WHY NOT RuntimeDirectory=
#   * the watchdog is Type=oneshot, so with the default
#     RuntimeDirectoryPreserve=no systemd would delete this directory at the
#     end of EVERY cycle, taking the inhibit marker and the restart budget
#     with it;
#   * the directory must exist while the Gateway is STOPPED (that is exactly
#     when the marker matters), and RuntimeDirectory is torn down on stop;
#   * the directory must exist before either unit has ever started.
# systemd-tmpfiles-setup.service runs at early boot, so recreation after a
# reboot is deterministic and does not depend on either unit starting.
#
# WHY 0700
# /run/ibgateway holds the watchdog state file, the launch lock and the order
# lifecycle marker. The lifecycle marker INHIBITS unattended process action, so
# a world-writable directory would let any local user create or delete a file
# that changes supervision behaviour. 0700 owned by the service user is the
# minimum defensible mode. There is no more permissive fallback anywhere: if
# this directory is missing, the units fail closed (no leading '-' on their
# ReadWritePaths=) and the CLI creates it 0700 explicitly rather than
# inheriting a umask.
#
# Nothing here contains a credential; the IB login id/password live only in the
# IBC config file (chmod 600) that IBC itself reads.
#
# Type Path             Mode UID  GID  Age Argument
#                                     Age '-' => never age out; nothing here is
#                                     tmp-cleanable state.
d /run/ibgateway        0700 opc  opc  -   -
