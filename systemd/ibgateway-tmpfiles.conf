# systemd-tmpfiles configuration for the IB Gateway runtime directory.
#
# Install as /etc/tmpfiles.d/ibgateway.conf, then:
#     systemd-tmpfiles --create /etc/tmpfiles.d/ibgateway.conf
#
# WHY THIS EXISTS
# ---------------
# /run/ibgateway holds the watchdog state file, the launch lock and the order
# lifecycle marker. The lifecycle marker INHIBITS unattended process action, so
# a world-writable directory would let any local user create or delete a file
# that changes supervision behaviour. 0700 owned by the service user is the
# minimum defensible mode.
#
# Nothing here contains a credential; the IB login id/password live only in the
# IBC config file (chmod 600) that IBC itself reads.
#
# Type Path             Mode UID  GID  Age Argument
d /run/ibgateway        0700 opc  opc  -   -
