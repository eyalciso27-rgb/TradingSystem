[project]
name = "trading-system"
version = "0.1.0"
description = "Trading system monorepo skeleton (IMP-0001) - no business logic"
requires-python = ">=3.13,<3.14"
dependencies = [
    "trading-api",
    "trading-core-worker",
    "trading-scheduler",
    "trading-execution-agent",
    "trading-contracts",
    "trading-domain",
    "trading-application",
    "trading-config",
    "trading-persistence",
    "trading-event-bus",
    "trading-market-data-core",
    "trading-broker-core",
    "trading-broker-ibkr",
    "trading-observability",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/core-worker",
    "apps/scheduler",
    "apps/execution-agent",
    "packages/py/*",
]

[tool.uv.sources]
trading-api = { workspace = true }
trading-core-worker = { workspace = true }
trading-scheduler = { workspace = true }
trading-execution-agent = { workspace = true }
trading-contracts = { workspace = true }
trading-domain = { workspace = true }
trading-application = { workspace = true }
trading-config = { workspace = true }
trading-persistence = { workspace = true }
trading-event-bus = { workspace = true }
trading-market-data-core = { workspace = true }
trading-broker-core = { workspace = true }
trading-broker-ibkr = { workspace = true }
trading-observability = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["apps", "packages/py", "scripts", "tests"]
# Keep src-layout workspace members as explicit package bases. Repository
# scripts are a normal ``scripts.*`` package rooted at the repository itself;
# adding ``scripts/`` as another package base gives every script a competing
# top-level identity (for example both ``check_architecture`` and
# ``scripts.check_architecture``).
mypy_path = "apps/api/src:apps/core-worker/src:apps/execution-agent/src:apps/scheduler/src:packages/py/application/src:packages/py/broker-core/src:packages/py/broker-ibkr/src:packages/py/config/src:packages/py/contracts/src:packages/py/domain/src:packages/py/event-bus/src:packages/py/market-data-core/src:packages/py/observability/src:packages/py/persistence/src"
explicit_package_bases = true
exclude = ["node_modules", "\\.venv", "alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fallback import path for the workspace's `src`-layout packages so that a
# bare `python3 -m pytest ...` (no `uv run`, i.e. the interpreter that
# `uv sync` installed the workspace into is not on PATH) can still import
# `trading_*` modules. `uv run pytest` already resolves these via the
# editable installs in `.venv`; this list points at the identical source
# directories, so it is a no-op there and only matters for a plain
# interpreter invocation. Canonical development still uses `uv run pytest`
# (see README.md); do not remove entries here without confirming both
# invocation styles still pass.
pythonpath = [
    "apps/api/src",
    "apps/core-worker/src",
    "apps/execution-agent/src",
    "apps/scheduler/src",
    "packages/py/application/src",
    "packages/py/broker-core/src",
    "packages/py/broker-ibkr/src",
    "packages/py/config/src",
    "packages/py/contracts/src",
    "packages/py/domain/src",
    "packages/py/event-bus/src",
    "packages/py/market-data-core/src",
    "packages/py/observability/src",
    "packages/py/persistence/src",
]
