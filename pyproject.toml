[project]
name = "trading-system"
version = "0.1.0"
description = "Trading system monorepo skeleton (IMP-0001) - no business logic"
requires-python = ">=3.13,<3.14"
dependencies = [
    "trading-api",
    "trading-core-worker",
    "trading-scheduler",
    "trading-execution-agent",
    "trading-contracts",
    "trading-domain",
    "trading-application",
    "trading-config",
    "trading-persistence",
    "trading-event-bus",
    "trading-market-data-core",
    "trading-broker-core",
    "trading-broker-ibkr",
    "trading-observability",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/core-worker",
    "apps/scheduler",
    "apps/execution-agent",
    "packages/py/*",
]

[tool.uv.sources]
trading-api = { workspace = true }
trading-core-worker = { workspace = true }
trading-scheduler = { workspace = true }
trading-execution-agent = { workspace = true }
trading-contracts = { workspace = true }
trading-domain = { workspace = true }
trading-application = { workspace = true }
trading-config = { workspace = true }
trading-persistence = { workspace = true }
trading-event-bus = { workspace = true }
trading-market-data-core = { workspace = true }
trading-broker-core = { workspace = true }
trading-broker-ibkr = { workspace = true }
trading-observability = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["apps", "packages/py", "scripts", "tests"]
exclude = ["node_modules", "\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
