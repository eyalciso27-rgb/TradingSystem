# IBC configuration EXAMPLE — POI-IBKR Paper auto-login.
#
# Copy to the SECURE location (NOT the repo), fill in the Paper credentials,
# and lock it down:
#
#   install -d -m 700 -o opc -g opc /home/opc/.config/ibc
#   cp scripts/ibc/config.example.ini /home/opc/.config/ibc/config.ini
#   chmod 600 /home/opc/.config/ibc/config.ini
#   chown opc:opc /home/opc/.config/ibc/config.ini
#   # then edit /home/opc/.config/ibc/config.ini and set IbLoginId / IbPassword
#
# NEVER commit a filled-in config.ini. The real path is git-ignored and a test
# guardrail fails the build if a non-empty IbPassword/IbLoginId is committed.

# --- PAPER ONLY -------------------------------------------------------------
# The start script refuses anything that is not exactly "paper".
TradingMode=paper

# --- credentials (fill in ONLY in the secure copy, never here) --------------
# Leave BLANK in this example. In the real chmod-600 copy, set the Paper login.
IbLoginId=
IbPassword=

# --- 2FA handling (IBKR Mobile) ---------------------------------------------
# Do not bypass 2FA. When a 2FA request times out, IBC re-logins and triggers a
# fresh IBKR Mobile notification for the owner to approve.
ReloginAfterSecondFactorAuthenticationTimeout=yes
# Seconds IBC waits between the 2FA prompt and giving up / relogging in.
SecondFactorAuthenticationExitInterval=60
# Let IBC own the 2FA relogin; the watchdog owns process/API restarts. One
# mechanism per concern — they never both restart.
ExitAfterSecondFactorAuthenticationTimeout=no

# --- non-brokerage warning + incoming connections ---------------------------
AcceptNonBrokerageAccountWarning=yes
# Reject unsolicited incoming API connections.
AcceptIncomingConnectionAction=reject

# --- API endpoint: localhost + paper port 4002 ------------------------------
OverrideTwsApiPort=4002
BindAddress=127.0.0.1
# Read-only API at this stage: no orders are placed by this system.
ReadOnlyApi=yes

# --- misc safety ------------------------------------------------------------
# Dismiss the "existing session detected" dialog by taking over is DISABLED so
# we never fight a real interactive session.
ExistingSessionDetectedAction=manual
# Do not auto-restart from within IBC on a fatal error; the watchdog decides.
IbAutoClosedown=no
