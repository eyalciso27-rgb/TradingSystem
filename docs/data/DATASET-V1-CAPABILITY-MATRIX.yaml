# State vocabulary:
#   EMPIRICALLY_VERIFIED - proven by real owner-host evidence.
#   CONTRACT_READY       - code/schema/validation exists, but no real source evidence yet.
#   BLOCKED_EXTERNAL     - requires a real external source/entitlement/dataset before proof.
#
# This matrix is about research Dataset V1 readiness. It does NOT change the
# frozen POI-IBKR-001 order-lifecycle status in docs/poi/STATUS.yaml.

