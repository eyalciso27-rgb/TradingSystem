  pit_sp500_membership:
    state: BLOCKED_EXTERNAL
    contract_implementation: packages/py/market-data-core/src/trading_market_data_core/dataset_v1.py
    ingestion_implementation: packages/py/market-data-core/src/trading_market_data_core/dataset_v1_ingestion.py
    blocked_on: >-
      An owner-approved point-in-time S&P 500 membership source with historical
      effective dates, knowledge time (known_at), stable identity and provenance.
      Current-constituent snapshots are not acceptable. The bitemporal ingestion
      pipeline and fail-closed promotion gate exist, but no REAL source or
      verifiable evidence is wired, so the cell stays blocked.
  asof_gics:
    state: BLOCKED_EXTERNAL
    contract_implementation: packages/py/market-data-core/src/trading_market_data_core/dataset_v1.py
    ingestion_implementation: packages/py/market-data-core/src/trading_market_data_core/dataset_v1_ingestion.py
    blocked_on: >-
      An owner-approved historical GICS source with effective/as-of intervals,
      knowledge time and provenance. As with membership, the ingestion pipeline
      exists but no REAL source/evidence is wired; the cell stays blocked.
  delisted_security_history:
    state: BLOCKED_EXTERNAL
    contract_implementation: packages/py/market-data-core/src/trading_market_data_core/dataset_v1.py
    ingestion_implementation: packages/py/market-data-core/src/trading_market_data_core/dataset_v1_ingestion.py
    contract_status: CONTRACT_READY  # model + ingestion + validation exist and are tested
    blocked_on: >-
      A source that preserves historical/delisted securities and stable identity rather
      than returning only today's live symbol universe, with listing/delisting/
      last-trading dates, reason, venue, successor and knowledge time. The bitemporal
      delisting model, lifecycle states (NOT_YET_EXISTED/ACTIVE/DELISTED/UNKNOWN),
      symbol history and ingestion port exist and are fixture-tested, but no REAL
      source or verifiable evidence is wired, so the cell stays blocked.
  corporate_actions:
    state: BLOCKED_EXTERNAL
    contract_implementation: packages/py/market-data-core/src/trading_market_data_core/dataset_v1.py
    ingestion_implementation: packages/py/market-data-core/src/trading_market_data_core/dataset_v1_ingestion.py
    contract_status: CONTRACT_READY  # model + ingestion + validation exist and are tested
    blocked_on: >-
      A source for splits, reverse splits, cash/special/stock dividends, mergers,
      acquisitions, spinoffs, symbol changes, exchange changes and delistings with
      effective/ex/record/payment dates, Decimal ratios and amounts, currency,
      successor/predecessor identity, provenance and knowledge time. IBKR
      ADJUSTED_LAST availability alone does not prove the event-level contract.
      Synthetic or fabricated events are never evidence; the cell stays blocked
      until a REAL historical source with a verifiable checksum is supplied.

builder:
  implementation: packages/py/market-data-core/src/trading_market_data_core/dataset_v1_builder.py
  snapshot_readiness_levels: [CONTRACT_ONLY, PARTIAL_DATA, EMPIRICAL_REFERENCE_READY,
                              BACKTEST_ELIGIBLE]
  # A snapshot built from fixtures reaches CONTRACT_ONLY at most. While any of the
  # four external cells below is BLOCKED_EXTERNAL, no snapshot can be
  # BACKTEST_ELIGIBLE — "built successfully" is never "backtest ready".
  current_max_readiness: CONTRACT_ONLY

readiness:
  active_name_price_qualification_sufficient: true
  full_dataset_contract_ready: false
  reason: >-
    The six IBKR active-name historical capabilities are empirically verified, but PIT
    membership, as-of GICS, delisted history and event-level corporate actions remain
    external-data gaps. The implementation must fail closed until all required cells
    are EMPIRICALLY_VERIFIED.
