# Component Evidence Matrix — machine-readable project truth.
#
# The single machine-readable companion to
# docs/roadmaps/TRADING_SYSTEM_MASTER_PLAN.md. Schema-validated and
# cross-checked against the prose plan, CLAUDE_CODE_TASKS.yaml, docs/poi/
# STATUS.yaml and the Phase-13 deferred ledger by
# tests/status/test_project_consistency.py.
#
# BINDING RULES enforced by that test suite:
#   * a component may only claim real_integration_status INTEGRATION_VERIFIED
#     when it names an evidence file that EXISTS in docs/poi/evidence/;
#   * no strategy may be called eligible without OUT_OF_SAMPLE_PASS AND
#     SHADOW_PASS evidence;
#   * a component whose PoI is BLOCKED may not be described as active;
#   * DEF statuses here must match the Phase-13 ledger exactly;
#   * the AI Review Committee may never be described as execution authority;
#   * PAPER_AUTO and LIVE must read DISABLED until every gate passes;
#   * the canonical task count must equal the count in CLAUDE_CODE_TASKS.yaml.
#
# Tests passing is NEVER integration evidence.
#
# 2026-09-03 A-WP2 canonical-state reconciliation. PR #104 (S&P historical
# secondary PIT source registry — offline provenance only, nothing fetched or
# integrated), PR #105 (current/forward S&P 500 + current-GICS immutable
# snapshot archive hardening) and PR #106 (fail-closed corporate-action PIT
# qualification — an offline, fixture-only validator) are MERGED and
# COMPLETE. Do not recreate them. None of the three closes the frozen
# strategy's required historical S&P 500 PIT membership or historical GICS
# evidence: those remain WAITING_EXTERNAL. See
# docs/roadmaps/MVP_DELIVERY_PLAN.md §5 (M3) for the full gap accounting and
# docs/status/PIT_DATASET_QUALIFICATION.md for the capability matrix.
