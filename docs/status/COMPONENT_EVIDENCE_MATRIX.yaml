  # 2026-08-13 PHASE-6 IMPLEMENTATION PACKAGE (branch feat/phase6-source-adapters)
  # then built the four adapters that have an official / ToS-permitted access
  # path — IMP-0603 (Telegram user/TDLib), IMP-0604 (Telegram bot), IMP-0607
  # (news/filings via SEC EDGAR + news port), IMP-0608 (TradingView webhook) —
  # as real production modules under
  # packages/py/application/src/trading_application/source_adapters/, each with
  # deterministic-fake contract/reconnect/failure tests under tests/adapters/.
  # Their CODE is IMPLEMENTED; their real-account PoIs remain BLOCKED (owner
  # credentials/hosts required). IMP-0601 (WhatsApp user), IMP-0602 (Discord
  # user) and IMP-0606 (InvestingPro) stay NOT_IMPLEMENTED: no official /
  # ToS-permitted programmatic access path exists and none may be fabricated
  # without an approved ADR (see docs/status/PHASE6_SOURCE_ADAPTERS.md).
  implemented: 69          # 65 + IMP-0603, IMP-0604, IMP-0607, IMP-0608 (code)
  remaining: 13            # IMP-0601/0602/0606 (ToS-blocked) + non-PHASE-6 work
  # PHASE-5 (IMP-0501..0503) is implementation-complete but its EXIT GATE is
  # NOT satisfied: 2 of 12 P0 PoIs are PASS and 0 alternate ADRs exist.
  # "IMPLEMENTED" is a code-merged claim only; it is never integration proof.
  phase5_exit_gate_satisfied: false

# -- global execution-mode gates (binding) ----------------------------------
execution_modes:
  shadow: EVALUATE_ONLY          # no SubmitAuthorization on the shadow path
  paper_manual: BLOCKED          # gated on POI-IBKR-001
  paper_auto: DISABLED           # frozen: IMP-1402, Track C
  live: DISABLED                 # frozen; never enabled by any current plan
  flatten: NOT_IMPLEMENTED       # the harness never flattens, by design

# -- vocabularies -----------------------------------------------------------
enums:
  implementation_status: [IMPLEMENTED, PARTIAL, SKELETON, NOT_IMPLEMENTED]
  evidence_class:
    - IMPLEMENTED
    - TESTED_WITH_FAKES
    - INTEGRATION_VERIFIED
    - HISTORICALLY_TESTED
    - OUT_OF_SAMPLE_PASS
    - SHADOW_PASS
    - PAPER_PASS
    - PROFITABILITY_NOT_PROVEN
    - BLOCKED
  real_integration_status: [NONE, READ_ONLY_VERIFIED, INTEGRATION_VERIFIED, BLOCKED]
  strategy_dependency: [REQUIRED, OPTIONAL, NONE]
  owner_dependency: [NONE, OWNER_ACCOUNT, OWNER_HOST, OWNER_DECISION, OWNER_RUN]

