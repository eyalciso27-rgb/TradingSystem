        evidence: evidence/POI-IBKR-001-CANCEL-DEFECT.md
        defects: D-CANCEL-01..D-CANCEL-08
        post_fix_verification: NOT_RUN  # DEF-18, DEF-19, DEF-20
    # PASSING read-only owner-host runs. These are real, post-clock-fix
    # evidence, but a read-only verification can never complete an
    # ORDER-LIFECYCLE PoI: POI-IBKR-001 stays BLOCKED regardless.
    owner_host_passes:
