# Canonical PoI status registry (IMP-0501/0502/0503).
# States: PASS | FAIL | BLOCKED. The backlog itself is frozen in
# docs/baseline-v0.5/POI_BACKLOG.yaml. Evidence lives in docs/poi/evidence/.
version: "0.1"
updated: "2026-07-10"

# PHASE-5 exit gate (DoD of IMP-0501: "Every P0 item PASS/approved alternate
# ADR."). The three PHASE-5 tasks are implementation-complete (registry,
# evidence, drills, provider catalog), but the phase exit gate is NOT
# satisfied: 2 of 12 P0 items are PASS, 10 are BLOCKED on owner-supplied
# accounts/credentials/hosts, and 0 alternate ADRs exist (an ADR may not be
# created merely to paper over missing accounts/credentials/test
# environments). PHASE-6 must not start for a connector whose PoI is BLOCKED.
phase5_exit_gate:
  status: BLOCKED_EXTERNAL
  implementation_complete: true
  gate_satisfied: false
  p0_pass: 2
  p0_blocked: 10
  alternate_adrs_approved: 0
  completion_requirements: PHASE5-COMPLETION-REQUIREMENTS.md
  # Owner deferral (ADR-0014, 2026-07-08): the external P0 PoIs are DEFERRED,
  # not passed. Core development may proceed on mocks/fixtures/replay/synthetic
  # data and broker-less paper simulation. Binding rule: before any real run
  # against an external source or broker, that PoI must be PASS. This does NOT
  # satisfy the exit gate; the 10 items below stay BLOCKED and OPEN.
  deferred_by_owner: ADR-0014
  core_development_allowed: true
  real_external_activation_allowed: false

