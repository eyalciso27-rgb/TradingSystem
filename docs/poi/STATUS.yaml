          PoI lifecycle orders; zero non-zero positions (the single remaining row
          carries quantity zero only); zero unresolved broker operation states;
          reconciliation reconciled=True findings=0; clean disconnect. RESULT
          PASS. Nothing was submitted, cancelled, modified or flattened
        evidence: evidence/POI-IBKR-001-VERIFY-CLEAN.md
        status_after_pass: ACCOUNT_VERIFIED_CLEAN
      - date: "2026-07-31T06:02:42Z"
        poi_id: POI-MD-001
        scenario: market-data-readonly
        symbol: F
        result: PASS
        read_only: true
        summary: >-
          paper account gate PASS; contract F resolved; no entitlement error;
          marketDataType=1 REALTIME; positive bid, ask and last; canonical
          freshness REALTIME; EXECUTION_ELIGIBLE=true (a DATA-QUALITY verdict
          only - execution stays gated by POI-IBKR-001); clean disconnect
        evidence: evidence/POI-MD-001-REALTIME-F-20260731.md
        # The observed quote was evidence for THAT run only. It is now stale and
        # must never be copied into a future dry-run or execute command; a
        # submission requires a quote observed fresh immediately before the run.
        quote_reuse: FORBIDDEN_STALE
        # Does not advance the aggregate: the external-provider benchmark,
        # outage/fallback test, field-ownership matrix and provider ADR are
        # still deferred (Track A / A2, DEF-14).
        aggregate_poi_md_001: BLOCKED
    # Read-only owner-host findings. No order was submitted, cancelled or
    # modified to produce these; recording them never changes status.
    owner_host_findings:
      - date: "2026-07-30"
        method: read-only inspection (no order path exercised)
        result: DEFECT
        summary: >-
          the real adapter shipped a deterministic TEST clock as its production
          default, so a host at 2026-07-30T17:05:22Z produced adapter timestamps
          starting at 2026-07-10T12:00:01Z and incrementing one second per call;
          every snapshot, receipt, broker event, reconciliation result and health
          check carried a fabricated ~20-day-stale time. verify-clean separately
          collapsed to "broker error BROKER_UNHEALTHY; no retry", hiding the
          actual account state
        evidence: evidence/POI-IBKR-001-CLOCK-DEFECT.md
        defects: D-CLOCK-01, D-CLOCK-02
        post_fix_verification: PARTIAL  # DEF-19 PASS; DEF-18 + DEF-20 NOT_RUN
        # Consequence: any evidence artifact produced by a real owner-run BEFORE
        # this fix carries fabricated adapter timestamps and must be regenerated
        # rather than trusted. It cannot support a PASS.
        prior_artifacts: MUST_BE_REGENERATED
      - date: "2026-07-30"
        method: read-only inspection
        result: OBSERVATION
        summary: >-
          zero open orders and one non-zero unrelated Paper position, DVLT
          quantity 1352 (SUPERSEDED: the 2026-07-30T17:49:25Z verify-clean read
          the account flat - that row now carries quantity zero only. The harness
          never flattens, so any change was the owner's own, by hand).
          It is unrelated to any PoI operation. The harness never
          flattens and nothing acts on it; verify-clean correctly continues to
          FAIL while any non-zero position exists, and now names it explicitly.
          Closing it is an owner decision, by hand, in the Gateway/TWS UI
        owner_action: OWNER_DECISION_ONLY
    # Market-data dependency (ADR-0016, 2026-07-21): the proven
    # POI-MD-001.realtime_subgate satisfies the market-data dependency for
    # THIS PoI only. The POI-MD-001 aggregate stays BLOCKED (external
