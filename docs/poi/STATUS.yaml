    priority: P0
    status: BLOCKED
    evidence: evidence/BLOCKED-P0.md
    blocked_on: "The Paper ORDER LIFECYCLE has not completed. A real owner-run
      DID reach the broker order path (submit + acknowledgement + idempotent
      resubmit all passed, order never filled) but the CANCELLATION FAILED and
