    evidence_path_template: /tmp/poi-ibkr-001-reject-classification-<YYYYMMDD>.md
    prerequisites:
      - >-
        D-TIF-03 follow-up - verify against a real Gateway which IBKR error codes are
        deterministic pre-acceptance rejects (10052, 321, ...) before mapping any to
        a definite REJECTED state in the host transport error() handler
      - >-
        until verified, deterministic rejects remain UNKNOWN (mandatory reconciliation,
        conservative-safe)
    pass_criteria: >-
      the allowlist of pre-acceptance reject codes is empirically confirmed; UNKNOWN
      stays the default for ambiguous/unknown codes; no working order is ever hidden
    abort_criteria: any code that could correspond to an accepted/working order is proposed for REJECTED
    current_status: NOT_RUN
    status_after_pass: REJECT_CLASSIFICATION_VERIFIED
    cleanup: none (read-only preflight)
    never_flattens: true

