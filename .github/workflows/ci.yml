name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  repo-integrity:
    name: repo-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Baseline verification
        run: uv run python scripts/verify_baseline.py
      - name: Build metadata (records baseline hash and versions)
        run: uv run python scripts/build_metadata.py --output artifacts/generated/build_metadata.json
      - name: Shell syntax and shellcheck
        run: |
          set -euo pipefail
          for script in $(git ls-files '*.sh'); do
            bash -n "$script"
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # Repo-wide at ERROR: real defects, enforced everywhere.
          # SC1091: sourced paths resolve on the owner host, not in CI.
          shellcheck --severity=error --exclude=SC1091 $(git ls-files '*.sh')
          # The operational scripts are held to WARNING as well. Scoped
          # deliberately rather than claiming a repo-wide warning-clean tree
          # that has never been measured; widen it as older scripts are cleaned.
          shellcheck --severity=warning --exclude=SC1091             scripts/install_ops_assets.sh             scripts/remediate_owner_host_runtime.sh
      - name: Architecture guardrails
        run: uv run python scripts/check_architecture.py
      - name: Contract generation drift check
        run: uv run python scripts/generate_contracts.py --check
      - name: Docker Compose config validation
        env:
          POSTGRES_USER: ci-syntax-check
          POSTGRES_PASSWORD: ci-syntax-check
          PAPER_POSTGRES_USER: ci-syntax-check
          PAPER_POSTGRES_PASSWORD: ci-syntax-check
          GRAFANA_ADMIN_USER: ci-syntax-check
          GRAFANA_ADMIN_PASSWORD: ci-syntax-check
        run: |
          docker compose -f deploy/compose.yaml config -q
          docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml config -q
          docker compose -f deploy/compose.yaml -f deploy/compose.paper.yaml config -q
          docker compose -f deploy/compose.yaml -f deploy/compose.observability.yaml config -q
          docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml -f deploy/compose.observability.yaml config -q
          docker compose -f deploy/compose.yaml -f deploy/compose.paper.yaml -f deploy/compose.observability.yaml config -q
      - name: Whitespace check
        run: git diff --check
      - name: Generators must not modify tracked files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "tracked files changed or untracked files created by generators"
            exit 1
          fi

  python-quality:
    name: python-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy strict typecheck
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q

  db-migration:
    name: db-migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://trading:trading@localhost:5432/trading_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Alembic upgrade / downgrade / upgrade
        run: |
          uv run alembic -c packages/py/persistence/alembic.ini upgrade head
          uv run alembic -c packages/py/persistence/alembic.ini downgrade base
          uv run alembic -c packages/py/persistence/alembic.ini upgrade head
      - name: Alembic drift check
        run: uv run alembic -c packages/py/persistence/alembic.ini check
      - name: PostgreSQL migration tests
        run: uv run pytest tests/db -q

  node-quality:
    name: node-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack (pinned pnpm via packageManager)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Re-enable Corepack for selected Node
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: ESLint
        run: corepack pnpm lint
      - name: TypeScript typecheck
        run: corepack pnpm typecheck
      - name: Vitest
        run: corepack pnpm test

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # gitleaks-action reads the PR's commits (GET /pulls/{n}/commits) to scope
    # the scan; that needs pull-requests: read in addition to the repo-wide
    # contents: read. Minimal, read-only, scoped to this job.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (full history, redacted output)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  arm64-emulated:
    name: arm64-emulated
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Install deps and run test suite under linux/arm64 (QEMU)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/repo" -w /repo \
            -e UV_LINK_MODE=copy \
            -e UV_PROJECT_ENVIRONMENT=/tmp/venv \
            ghcr.io/astral-sh/uv:python3.13-bookworm-slim \
            sh -ec '
              echo "machine: $(uname -m)"
              test "$(uname -m)" = "aarch64"
              uv sync --locked
              uv run python scripts/verify_baseline.py
              uv run python scripts/check_architecture.py
              uv run pytest -q
            '
