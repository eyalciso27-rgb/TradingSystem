[project]
name = "trading-execution-agent"
version = "0.1.0"
description = "Broker adapter runtime, orders, events and reconciliation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "trading-application",
    "trading-broker-core",
    "trading-broker-ibkr",
    "trading-contracts",
    "trading-market-data-core",
    "trading-observability",
    "trading-persistence",
]

[project.scripts]
# The owner-safe probe. It has no submission path.
trading-execution-probe = "trading_execution_agent.__main__:main"

[tool.uv.sources]
trading-application = { workspace = true }
trading-broker-core = { workspace = true }
trading-broker-ibkr = { workspace = true }
trading-contracts = { workspace = true }
trading-market-data-core = { workspace = true }
trading-observability = { workspace = true }
trading-persistence = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
